project:
  type: default
  output-dir: build
  # Only the slide decks are rendered; notebooks, source/ are not.
  render:
    - index.qmd
    - day1.qmd
    - day2.qmd

bibliography: references.bib

execute:
  enabled: true
  echo: true

format:
  revealjs:
    slide-number: c
    menu:
      numbers: true
    chalkboard: true
    scrollable: true
    preview-links: false
    view-distance: 10
    mobile-view-distance: 10
    auto-animate: true
    auto-animate-easing: ease-in
    auto-animate-duration: 0.5
    auto-play-media: true
    code-overflow: wrap
    highlight-style: atom-one
    css: styles.css
    footer: "Introduction to Scientific Python (https://neuroinformatics.dev/course-intro-scientific-python)"
    from: markdown+emoji   # enable emoji support
    mermaid:
      theme: neutral
      fontFamily: arial
      curve: linear
